<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fichário das cartas de Greed Island (Hunter x Hunter): busca, filtros, favoritos e times." />
    <title>Fichário de Greed Island</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Anti-flash: aplica o tema ANTES de qualquer pintura. Sem isto, quem usa o
      modo noturno veria um "piscar" claro enquanto o React carrega e o
      useTheme roda. É a mesma regra do useTheme (src/hooks/useTheme.js):
      escolha salva em gi:theme ou, se não houver, o tema do sistema.
    -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('gi:theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- Fontes: Cinzel (gravação, títulos) e Atkinson Hyperlegible (texto, feita para legibilidade). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
